<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="245mm" viewBox="0 0 1800 1050" role="img" aria-labelledby="title desc">
  <title id="title">Heatwave AI: จากข้อมูลฝึกสู่การทำนาย</title>
  <desc id="desc">กราฟเชิงงานวิจัยอธิบายข้อมูลที่ใช้ฝึกโมเดล Logistic Regression แบบ balanced และการปรับเทียบ Platt รวมถึงข้อมูลที่ใช้ตอนทำนายจริง</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#4b3025" flood-opacity=".12"/>
    </filter>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#e8ded2" stroke-width="1" opacity=".4"/>
    </pattern>
    <linearGradient id="heat" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f3b64d"/><stop offset=".55" stop-color="#ee7a3e"/><stop offset="1" stop-color="#d94c3a"/>
    </linearGradient>
  </defs>

  <rect width="1800" height="1050" fill="#fff8ea"/>
  <rect width="1800" height="1050" fill="url(#grid)"/>
  <rect width="1800" height="136" fill="#3b2720"/>
  <rect y="128" width="1800" height="8" fill="url(#heat)"/>
  <text x="58" y="62" font-family="IBM Plex Sans Thai, Tahoma, sans-serif" font-size="39" font-weight="900" fill="#fff">Heatwave AI คืออะไร?</text>
  <text x="58" y="103" font-family="IBM Plex Sans Thai, Tahoma, sans-serif" font-size="21" font-weight="600" fill="#f6c55a">ฝึกจากอดีต → ตรวจสอบตามเวลา → ทำนายความน่าจะเป็นจากข้อมูลที่รู้ ณ วันออก forecast</text>
  <text x="1742" y="62" text-anchor="end" font-family="Space Grotesk, Tahoma, sans-serif" font-size="19" font-weight="700" fill="#fff">RESEARCH GRAPHIC</text>
  <text x="1742" y="94" text-anchor="end" font-family="Space Grotesk, Tahoma, sans-serif" font-size="16" fill="#d8c9c2">Train → Serve</text>

  <g filter="url(#shadow)">
    <rect x="58" y="165" width="536" height="105" rx="20" fill="#fffcf5" stroke="#d8cdc0" stroke-width="2"/>
    <rect x="632" y="165" width="536" height="105" rx="20" fill="#fffcf5" stroke="#d8cdc0" stroke-width="2"/>
    <rect x="1206" y="165" width="536" height="105" rx="20" fill="#fffcf5" stroke="#d8cdc0" stroke-width="2"/>
  </g>
  <text x="87" y="211" font-family="Space Grotesk, Tahoma, sans-serif" font-size="29" font-weight="800" fill="#ee6a3b">77 จังหวัด</text>
  <text x="87" y="242" font-family="IBM Plex Sans Thai, Tahoma, sans-serif" font-size="17" fill="#6c5b52">ระดับผลลัพธ์ที่โมเดลออกให้ผู้ใช้</text>
  <text x="661" y="211" font-family="Space Grotesk, Tahoma, sans-serif" font-size="29" font-weight="800" fill="#ee6a3b">2–4 สัปดาห์</text>
  <text x="661" y="242" font-family="IBM Plex Sans Thai, Tahoma, sans-serif" font-size="17" fill="#6c5b52">ช่วงที่ผ่านเกณฑ์สำหรับการเผยแพร่หลัก</text>
  <text x="1235" y="211" font-family="Space Grotesk, Tahoma, sans-serif" font-size="29" font-weight="800" fill="#3e8062">Probability</text>
  <text x="1235" y="242" font-family="IBM Plex Sans Thai, Tahoma, sans-serif" font-size="17" fill="#6c5b52">โอกาสเกิดเหตุการณ์ ไม่ใช่การพยากรณ์อุณหภูมิ</text>

  <rect x="58" y="296" width="1684" height="320" rx="24" fill="#fff1e8" stroke="#e8653f" stroke-width="3"/>
  <circle cx="94" cy="336" r="23" fill="#ee6a3b"/><text x="94" y="344" text-anchor="middle" font-family="Space Grotesk, Tahoma, sans-serif" font-size="17" font-weight="800" fill="#fff">01</text>
  <text x="132" y="330" font-family="Space Grotesk, Tahoma, sans-serif" font-size="14" font-weight="800" letter-spacing="2" fill="#c65330">TRAINING + VALIDATION</text>
  <text x="132" y="365" font-family="IBM Plex Sans Thai, Tahoma, sans-serif" font-size="28" font-weight="900" fill="#3b2720">การฝึกโมเดลด้วยข้อมูลอดีต</text>
  <text x="1695" y="352" text-anchor="end" font-family="IBM Plex Sans Thai, Tahoma, sans-serif" font-size="15" fill="#8b7569">label อนาคตใช้สร้างคำตอบและตรวจสอบเท่านั้น</text>

  <g filter="url(#shadow)">
    <rect x="82" y="402" width="392" height="175" rx="17" fill="#fffcf5" stroke="#e4d8ca" stroke-width="2"/>
    <rect x="500" y="402" width="392" height="175" rx="17" fill="#fffcf5" stroke="#e4d8ca" stroke-width="2"/>
    <rect x="918" y="402" width="392" height="175" rx="17" fill="#fffcf5" stroke="#e4d8ca" stroke-width="2"/>
    <rect x="1336" y="402" width="392" height="175" rx="17" fill="#fffcf5" stroke="#e4d8ca" stroke-width="2"/>
  </g>
  <g font-family="Space Grotesk, Tahoma, sans-serif" font-size="15" font-weight="800" fill="#ee6a3b">
    <text x="108" y="437">A · DATA</text><text x="526" y="437">B · TARGET</text><text x="944" y="437">C · MODEL</text><text x="1362" y="437">D · VALIDATION</text>
  </g>
  <g font-family="IBM Plex Sans Thai, Tahoma, sans-serif" fill="#3b2720">
    <text x="108" y="472" font-size="21" font-weight="900">ข้อมูลย้อนหลัง</text>
    <text x="108" y="504" font-size="15"><tspan x="108">ERA5 1994–2023: Tmax, soil moisture</tspan><tspan x="108" dy="23">ชั้น 1/3 · MJO · Niño3.4 lag · เวลา/พื้นที่</tspan></text>
    <text x="526" y="472" font-size="21" font-weight="900">สร้างเหตุการณ์</text>
    <text x="526" y="504" font-size="15"><tspan x="526">Tmax สูงกว่า P90 ของพื้นที่</tspan><tspan x="526" dy="23">ต่อเนื่อง ≥ 3 วัน → weekly label lead 2–6</tspan></text>
    <text x="944" y="472" font-size="21" font-weight="900">ฝึก ML + calibrate</text>
    <text x="944" y="504" font-size="15"><tspan x="944">Logistic Regression แบบ balanced</tspan><tspan x="944" dy="23">ปรับ probability ด้วย Platt calibration</tspan></text>
    <text x="1362" y="472" font-size="21" font-weight="900">ทดสอบอย่างเป็นธรรม</text>
    <text x="1362" y="504" font-size="15"><tspan x="1362">Rolling-origin 5 รอบ · gap 49 วัน</tspan><tspan x="1362" dy="23">เทียบ climatology · persistence · BSS · AUC</tspan></text>
  </g>
  <g font-family="Space Grotesk, Tahoma, sans-serif" font-size="12" fill="#3e8062">
    <text x="108" y="558">historical observations</text><text x="526" y="558">weekly heatwave label</text><text x="944" y="558">logistic_balanced_cal</text><text x="1362" y="558">quality gate</text>
  </g>

  <line x1="900" y1="632" x2="900" y2="666" stroke="#ee6a3b" stroke-width="5" stroke-linecap="round"/><polygon points="900,686 886,662 914,662" fill="#ee6a3b"/>
  <rect x="733" y="638" width="334" height="30" rx="15" fill="#f3b64d"/><text x="900" y="659" text-anchor="middle" font-family="Space Grotesk, Tahoma, sans-serif" font-size="13" font-weight="800" fill="#3b2720">MODEL ARTIFACTS → พร้อมใช้กับข้อมูลใหม่</text>

  <rect x="58" y="704" width="1684" height="267" rx="24" fill="#eaf2e7" stroke="#3e8062" stroke-width="3"/>
  <circle cx="94" cy="744" r="23" fill="#3e8062"/><text x="94" y="752" text-anchor="middle" font-family="Space Grotesk, Tahoma, sans-serif" font-size="17" font-weight="800" fill="#fff">02</text>
  <text x="132" y="738" font-family="Space Grotesk, Tahoma, sans-serif" font-size="14" font-weight="800" letter-spacing="2" fill="#3e8062">PREDICTION + PUBLICATION</text>
  <text x="132" y="773" font-family="IBM Plex Sans Thai, Tahoma, sans-serif" font-size="28" font-weight="900" fill="#3b2720">การทำนายเมื่อมีข้อมูลรอบใหม่</text>
  <text x="1695" y="760" text-anchor="end" font-family="IBM Plex Sans Thai, Tahoma, sans-serif" font-size="15" fill="#547461">ไม่มี label หรือข้อมูลอนาคตเป็น input</text>

  <g filter="url(#shadow)">
    <rect x="82" y="807" width="392" height="132" rx="17" fill="#fffcf5" stroke="#d8e5d9" stroke-width="2"/>
    <rect x="500" y="807" width="392" height="132" rx="17" fill="#fffcf5" stroke="#d8e5d9" stroke-width="2"/>
    <rect x="918" y="807" width="392" height="132" rx="17" fill="#fffcf5" stroke="#d8e5d9" stroke-width="2"/>
    <rect x="1336" y="807" width="392" height="132" rx="17" fill="#fffcf5" stroke="#d8e5d9" stroke-width="2"/>
  </g>
  <g font-family="Space Grotesk, Tahoma, sans-serif" font-size="15" font-weight="800" fill="#3e8062">
    <text x="108" y="840">A · CURRENT DATA</text><text x="526" y="840">B · SAME FEATURES</text><text x="944" y="840">C · PROBABILITY</text><text x="1362" y="840">D · PUBLIC OUTPUT</text>
  </g>
  <g font-family="IBM Plex Sans Thai, Tahoma, sans-serif" fill="#3b2720">
    <text x="108" y="874" font-size="18" font-weight="900">ดึงข้อมูลล่าสุด</text><text x="108" y="903" font-size="14"><tspan x="108">ERA5 ~70 วัน + MJO + Niño3.4</tspan><tspan x="108" dy="20">ที่มีอยู่ ณ วันออก forecast</tspan></text>
    <text x="526" y="874" font-size="18" font-weight="900">สร้าง feature ชุดเดิม</text><text x="526" y="903" font-size="14"><tspan x="526">ใช้ feature builder เดียวกับ train</tspan><tspan x="526" dy="20">เพื่อรักษา train–serve parity</tspan></text>
    <text x="944" y="874" font-size="18" font-weight="900">คำนวณโอกาสเกิด</text><text x="944" y="903" font-size="14"><tspan x="944">Estimator → calibrator → probability</tspan><tspan x="944" dy="20">เทียบ climatology รายจังหวัด</tspan></text>
    <text x="1362" y="874" font-size="18" font-weight="900">ส่งต่อให้ผู้ใช้</text><text x="1362" y="903" font-size="14"><tspan x="1362">77 จังหวัด · lead 2–4 หลัก</tspan><tspan x="1362" dy="20">HeatMAP App / LINE OA</tspan></text>
  </g>

  <rect x="58" y="995" width="1684" height="40" rx="18" fill="#3b2720"/>
  <text x="900" y="1021" text-anchor="middle" font-family="IBM Plex Sans Thai, Tahoma, sans-serif" font-size="16" font-weight="800" fill="#fff">Production = Logistic balanced + Platt calibration  |  LightGBM = research candidate ยังไม่ใช่ production  |  NO FUTURE TARGET INPUT</text>
</svg>
