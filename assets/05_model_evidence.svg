<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="233mm" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">ผลการทดสอบ AI</title>
  <desc id="desc">กราฟ BSS และ AUC สำหรับระยะพยากรณ์สองถึงสี่สัปดาห์</desc>
  
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5A342A" flood-opacity="0.10"/>
      </filter>
      <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="12" stroke="#BDB3A8" stroke-width="4"/>
      </pattern>
      <linearGradient id="heatGradient" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#FFF3D7"/><stop offset="0.45" stop-color="#F5B84E"/>
        <stop offset="0.75" stop-color="#EE6A3B"/><stop offset="1" stop-color="#9E2F31"/>
      </linearGradient>
    </defs>
    
  <rect x="0" y="0" width="1800" height="1000" rx="0" fill="#FFF8EA" stroke="none" stroke-width="0" opacity="1"/><circle cx="70" cy="70" r="34" fill="#EE6A3B" stroke="none" stroke-width="0"/><text x="70" y="81" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="25" font-weight="900" fill="#FFFFFF" text-anchor="middle" opacity="1">05</text><text x="125" y="76" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="44" font-weight="900" fill="#5A342A" text-anchor="start" opacity="1">ผลบนข้อมูลที่ AI ไม่เคยเห็น</text><text x="125" y="112" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="21" font-weight="550" fill="#6C5B52" text-anchor="start" opacity="1">BSS มากกว่า 0 = ค่าความน่าจะเป็นดีกว่าค่าเฉลี่ยภูมิอากาศย้อนหลัง</text><rect x="55" y="150" width="1010" height="730" rx="28" fill="#FFFCF5" stroke="#D8CDC0" stroke-width="2" opacity="1"/><text x="95" y="208" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="30" font-weight="900" fill="#5A342A" text-anchor="start" opacity="1">Brier Skill Score (BSS)</text><line x1="160" y1="765" x2="970" y2="765" stroke="#8D7C70" stroke-width="4" stroke-linecap="round" opacity="1"/><rect x="243" y="327.3125" width="144" height="437.6875" rx="16" fill="#3E8062" stroke="none" stroke-width="0" opacity="1"/><text x="315" y="307.3125" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="28" font-weight="900" fill="#3E8062" text-anchor="middle" opacity="1">+0.298</text><text x="315" y="813" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="22" font-weight="800" fill="#5A342A" text-anchor="middle" opacity="1">2 สัปดาห์</text><rect x="237" y="820" width="156" height="36" rx="18" fill="#3E8062" stroke="none" stroke-width="0" opacity="1"/><text x="315" y="845" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="16" font-weight="850" fill="#FFFFFF" text-anchor="middle" opacity="1">เผย