nd" opacity="1"/><text x="135" y="478.25" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="16" font-weight="650" fill="#6C5B52" text-anchor="end" opacity="1">0.2</text><line x1="160" y1="324.375" x2="970" y2="324.375" stroke="#E3D9CE" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="135" y="331.375" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="16" font-weight="650" fill="#6C5B52" text-anchor="end" opacity="1">0.3</text><rect x="1110" y="150" width="635" height="730" rx="28" fill="#FFFCF5" stroke="#D8CDC0" stroke-width="2" opacity="1"/><text x="1150" y="208" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="27" font-weight="900" fill="#5A342A" text-anchor="start" opacity="1">ความสามารถในการแยกเหตุการณ์ (AUC)</text><text x="1150" y="300" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="22" font-weight="750" fill="#5A342A" text-anchor="start" opacity="1">2 สัปดาห์</text><rect x="1150" y="324" width="500" height="30" rx="15" fill="#E8DED3" stroke="none" stroke-width="0" opacity="1"/><rect x="1150" y="324" width="91.99999999999997" height="30" rx="15" fill="#EE6A3B" stroke="none" stroke-width="0" opacity="1"/><line x1="1150" y1="317" x2="1150" y2="362" stroke="#7C6B60" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="1665" y="349" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="20" font-weight="850" fill="#EE6A3B" text-anchor="end" opacity="1">0.592</text><text x="1150" y="380" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="15" font-weight="600" fill="#6C5B52" text-anchor="start" opacity="1">0.5 = เท่ากับการเดาสุ่ม</text><text x="1150" y="445" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="22" font-weight="750" fill="#5A342A" text-anchor="start" opacity="1">3 สัปดาห์</text><rect x="1150" y="469" width="500" height="30" rx="15" fill="#E8DED3" stroke="none" stroke-width="0" opacity="1"/><rect x="1150" y="469" width="186.00000000000006" height="30" rx="15" fill="#3E8062" stroke="none" stroke-width="0" opacity="1"/><line x1="1150" y1="462" x2="1150" y2="507" stroke="#7C6B60" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="1665" y="494" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="20" font-weight="850" fill="#3E8062" text-anchor="end" opacity="1">0.686</text><text x="1150" y="525" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="15" font-weight="600" fill="#6C5B52" text-anchor="start" opacity="1">0.5 = เท่ากับการเดาสุ่ม</text><text x="1150" y="590" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="22" font-weight="750" fill="#5A342A" text-anchor="start" opacity="1">4 สัปดาห์</text><rect x="1150" y="614" width="500" height="30" rx="15" fill="#E8DED3" stroke="none" stroke-width="0" opacity="1"/><rect x="1150" y="614" width="68.99999999999994" height="30" rx="15" fill="#F3B64D" stroke="none" stroke-width="0" opacity="1"/><line x1="1150" y1="607" x2="1150" y2="652" stroke="#7C6B60" stroke-width="3" stroke-linecap="round" opacity="1"/><text x="1665" y="639" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="20" font-weight="850" fill="#F3B64D" text-anchor="end" opacity="1">0.569</text><text x="1150" y="670" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="15" font-weight="600" fill="#6C5B52" text-anchor="start" opacity="1">0.5 = เท่ากับการเดาสุ่ม</text><rect x="1150" y="735" width="555" height="94" rx="20" fill="#F8E1D8" stroke="none" stroke-width="0" opacity="1"/><text x="1428" y="772" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="24" font-weight="900" fill="#B94836" text-anchor="middle" opacity="1">5–6 สัปดาห์</text><text x="1428" y="807" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="20" font-weight="750" fill="#B94836" text-anchor="middle" opacity="1">ไม่ผ่านเกณฑ์ครบถ้วน จึงไม่เผยแพร่</text><rect x="55" y="910" width="1690" height="58" rx="18" fill="#5A342A" stroke="none" stroke-width="0" opacity="1"/><text x="900" y="949" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle" opacity="1">ความน่าเชื่อถือมาจากวิธีทดสอบและด่านเผยแพร่ ไม่ได้มาจากคำว่า “AI”</text>
</svg>