-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="24" font-weight="900" fill="#FFFFFF" text-anchor="middle" opacity="1">×</text><text x="1180" y="552" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="22" font-weight="800" fill="#B94836" text-anchor="start" opacity="1">หากไม่ผ่านด่าน: ไม่เผยแพร่ผลรอบใหม่</text><rect x="60" y="610" width="2080" height="66" rx="20" fill="#5A342A" stroke="none" stroke-width="0" opacity="1"/><text x="1100" y="653" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="25" font-weight="800" fill="#FFFFFF" text-anchor="middle" opacity="1">เว็บไซต์และ LINE อ่านข้อมูลชุดเดียวกัน • ไม่เก็บข้อมูลสุขภาพส่วนบุคคล</text>
