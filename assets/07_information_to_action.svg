<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="210mm" viewBox="0 0 1800 900" role="img" aria-labelledby="title desc">
  <title id="title">จากข้อมูลสู่การตัดสินใจ</title>
  <desc id="desc">อินโฟกราฟิกแปลงความน่าจะเป็นเป็นแผนที่ แนวโน้ม และคำแนะนำ</desc>
  
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5A342A" flood-opacity="0.10"/>
      </filter>
      <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="12" stroke="#BDB3A8" stroke-width="4"/>
      </pattern>
      <linearGradient id="heatGradient" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#FFF3D7"/><stop offset="0.45" stop-color="#F5B84E"/>
        <stop offset="0.75" stop-color="#EE6A3B"/><stop offset="1" stop-color="#9E2F31"/>
      </linearGradient>
    </defs>
    
  <rect x="0" y="0" width="1800" height="900" rx="0" fill="#FFF8EA" stroke="none" stroke-width="0" opacity="1"/><circle cx="70" cy="70" r="34" fill="#EE6A3B" stroke="none" stroke-width="0"/><text x="70" y="81" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="25" font-weight="900" fill="#FFFFFF" text-anchor="middle" opacity="1">07</text><text x="125" y="76" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="44" font-weight="900" fill="#5A342A" text-anchor="start" opacity="1">เปลี่ยนความน่าจะเป็นให้เป็นการตัดสินใจ</text><text x="125" y="112" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="21" font-weight="550" fill="#6C5B52" text-anchor="start" opacity="1">ข้อมูลที่ดีต้องบอกทั้ง ที่ไหน • รุนแรงแค่ไหน • ควรทำอะไร</text><rect x="60" y="180" width="330" height="575" rx="28" fill="#FFFCF5" stroke="#D8CDC0" stroke-width="2" opacity="1"/><text x="225" y="245" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="30" font-weight="900" fill="#5A342A" text-anchor="middle" opacity="1">ผลจาก AI</text><text x="225" y="315" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="88" font-weight="900" fill="#EE6A3B" text-anchor="middle" opacity="1">0.68</text><text x="225" y="360" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="23" font-weight="700" fill="#6C5B52" text-anchor="middle" opacity="1">โอกาสเกิด</text><text x="100" y="448" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="18" font-weight="650" fill="#6C5B52" text-anchor="start" opacity="1">สัปดาห์ 1</text><rect x="205" y="430" width="130" height="24" rx="12" fill="#E6DBD0" stroke="none" stroke-width="0" opacity="1"/><rect x="205" y="430" width="23.4" height="24" rx="12" fill="#F3B64D" stroke="none" stroke-width="0" opacity="1"/><text x="100" y="513" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="18" font-weight="650" fill="#6C5B52" text-anchor="start" opacity="1">สัปดาห์ 2</text><rect x="205" y="495" width="130" height="24" rx="12" fill="#E6DBD0" stroke="none" stroke-width="0" opacity="1"/><rect x="205" y="495" width="40.3" height="24" rx="12" fill="#F3B64D" stroke="none" stroke-width="0" opacity="1"/><text x="100" y="578" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="18" font-weight="650" fill="#6C5B52" text-anchor="start" opacity="1">สัปดาห์ 3</text><rect x="205" y="560" width="130" height="24" rx="12" fill="#E6DBD0" stroke="none" stroke-width="0" opacity="1"/><rect x="205" y="560" width="59.800000000000004" height="24" rx="12" fill="#F3B64D" stroke="none" stroke-width="0" opacity="1"/><text x="100" y="643" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="18" font-weight="650" fill="#6C5B52" text-anchor="start" opacity="1">สัปดาห์ 4</text><rect x="205" y="625" width="130" height="24" rx="12" fill="#E6DBD0" stroke="none" stroke-width="0" opacity="1"/><rect x="205" y="625" width="88.4" height="24" rx="12" fill="#EE6A3B" stroke="none" stroke-width="0" opacity="1"/><line x1="420" y1="470" x2="502.0" y2="470.0" stroke="#EE6A3B" stroke-width="7" stroke-linecap="round" opacity="1"/><polygon points="520,470 502.0,479.0 502.0,461.0" fill="#EE6A3B"/><circle cx="640" cy="470" r="112" fill="#235D66" stroke="none" stroke-width="0"/><text x="640" y="453" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="20" font-weight="900" fill="#F3B64D" text-anchor="middle" opacity="1">DESIGN</text><text x="640" y="492" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" opacity="1">แปลผล</text><text x="640" y="528" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="21" font-weight="700" fill="#FFFFFF" text-anchor="middle" opacity="1">ให้พร้อมใช้</text><line x1="760" y1="470" x2="842.0" y2="470.0" stroke="#EE6A3B" stroke-width="7" stroke-linecap="round" opacity="1"/><polygon points="860,470 842.0,479.0 842.0,461.0" fill="#EE6A3B"/><rect x="900" y="180" width="840" height="160" rx="24" fill="#FFFCF5" stroke="#EE6A3B" stroke-width="3" opacity="1"/><circle cx="955" cy="235" r="30" fill="#EE6A3B" stroke="none" stroke-width="0"/><text x="955" y="245" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" opacity="1">1</text><text x="1005" y="242" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="29" font-weight="900" fill="#5A342A" text-anchor="start" opacity="1">พื้นที่และระดับความเสี่ยง</text><text x="1005" y="290" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="20" font-weight="650" fill="#6C5B52" text-anchor="start" opacity="1">แผนที่ใช้สี + ป้ายข้อความ ไม่อาศัยสีเพียงอย่างเดียว</text><rect x="1525" y="216" width="44" height="86" rx="10" fill="#F3C65E" stroke="none" stroke-width="0" opacity="1"/><text x="1547" y="325" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="13" font-weight="650" fill="#6C5B52" text-anchor="middle" opacity="1">เฝ้าระวัง</text><rect x="1583" y="216" width="44" height="86" rx="10" fill="#EE8D42" stroke="none" stroke-width="0" opacity="1"/><text x="1605" y="325" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="13" font-weight="650" fill="#6C5B52" text-anchor="middle" opacity="1">สูง</text><rect x="1641" y="216" width="44" height="86" rx="10" fill="#C94B35" stroke="none" stroke-width="0" opacity="1"/><text x="1663" y="325" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="13" font-weight="650" fill="#6C5B52" text-anchor="middle" opacity="1">มาก</text><rect x="900" y="370" width="840" height="160" rx="24" fill="#FFFCF5" stroke="#427A9C" stroke-width="3" opacity="1"/><circle cx="955" cy="425" r="30" fill="#427A9C" stroke="none" stroke-width="0"/><text x="955" y="435" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" opacity="1">2</text><text x="1005" y="432" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="29" font-weight="900" fill="#5A342A" text-anchor="start" opacity="1">แนวโน้ม 2–4 สัปดาห์</text><text x="1005" y="480" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="20" font-weight="650" fill="#6C5B52" text-anchor="start" opacity="1">กราฟเส้นช่วยให้เห็นว่าความเสี่ยงกำลังเพิ่ม ลด หรือทรงตัว</text><path d="M1525 485 L1580 465 L1635 475 L1690 430" fill="none" stroke="#427A9C" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><circle cx="1690" cy="430" r="10" fill="#427A9C" stroke="none" stroke-width="0"/><rect x="900" y="560" width="840" height="195" rx="24" fill="#FFFCF5" stroke="#3E8062" stroke-width="3" opacity="1"/><circle cx="955" cy="615" r="30" fill="#3E8062" stroke="none" stroke-width="0"/><text x="955" y="625" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" opacity="1">3</text><text x="1005" y="622" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="29" font-weight="900" fill="#5A342A" text-anchor="start" opacity="1">วิธีรับมือและความช่วยเหลือ</text><text x="1005" y="670" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="20" font-weight="650" fill="#6C5B52" text-anchor="start" opacity="1">คำแนะนำตามระดับความเสี่ยง พร้อมปุ่มโทรฉุกเฉิน 1669</text><rect x="1520" y="630" width="170" height="70" rx="20" fill="#B94836" stroke="none" stroke-width="0" opacity="1"/><text x="1605" y="676" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF" text-anchor="middle" opacity="1">1669</text><rect x="60" y="805" width="1680" height="60" rx="18" fill="#5A342A" stroke="none" stroke-width="0" opacity="1"/><text x="900" y="845" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" text-anchor="middle" opacity="1">เว็บไซต์ + LINE Official Account = ผู้ใช้เลือกช่องทางที่เข้าถึงได้ง่ายที่สุด</text>
