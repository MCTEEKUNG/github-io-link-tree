<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1300" viewBox="0 0 1000 1300">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#183822" flood-opacity=".18"/></filter>
    <style>.t{font-family:"Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif}.title{font-size:62px;font-weight:700;fill:#1F683A}.sub{font-size:29px;fill:#5D5148}.cta{font-size:39px;font-weight:700;fill:white}.chip{font-size:24px;font-weight:700;fill:#2E6540}.foot{font-size:25px;font-weight:600;fill:#6A4A34}</style>
  </defs>

  <rect width="1000" height="1300" rx="70" fill="#FBF6E8"/>
  <rect x="24" y="24" width="952" height="1252" rx="58" fill="none" stroke="#D7C8B3" stroke-width="4"/>

  <!-- LINE badge -->
  <rect x="354" y="62" width="292" height="104" rx="36" fill="#06C755" filter="url(#shadow)"/>
  <path d="M399 88 h70 a28 28 0 0 1 28 28 v8 a28 28 0 0 1-28 28 h-25 l-23 18 5-18 h-27 a28 28 0 0 1-28-28 v-8 a28 28 0 0 1 28-28z" fill="white" opacity=".98"/>
  <text x="434" y="133" text-anchor="middle" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#06C755">LINE</text>
  <text x="548" y="130" text-anchor="middle" font-family="Arial,sans-serif" font-size="34" font-weight="700" fill="white">Official</text>

  <text x="500" y="244" text-anchor="middle" class="t title">เพิ่มเพื่อน Heatwave AI</text>
  <text x="500" y="292" text-anchor="middle" class="t sub">สแกนเพื่อรับการแจ้งเตือนความเสี่ยงคลื่นความร้อน</text>

  <!-- QR card; keep generous quiet zone -->
  <rect x="125" y="340" width="750" height="750" rx="46" fill="#FFFFFF" stroke="#B8DBC1" stroke-width="5" filter="url(#shadow)"/>
  <image x="185" y="400" width="630" height="630" preserveAspectRatio="none" image-rendering="pixelated" href="data:image/png;base64,"/>

  <!-- Scan corner accents remain outside QR quiet zone -->
  <path d="M160 430 v-45 q0-18 18-18 h45 M840 430 v-45 q0-18-18-18 h-45 M160 1000 v45 q0 18 18 18 h45 M840 1000 v45 q0 18-18 18 h-45" fill="none" stroke="#06C755" stroke-width="10" stroke-linecap="round"/>

  <!-- Benefit chips -->
  <rect x="118" y="1124" width="225" height="58" rx="29" fill="#E4F4E8"/>
  <circle cx="153" cy="1153" r="12" fill="#06C755"/>
  <text x="235" y="1162" text-anchor="middle" class="t chip">แจ้งทุกวันจันทร์</text>

  <rect x="387" y="1124" width="225" height="58" rx="29" fill="#E4F4E8"/>
  <circle cx="422" cy="1153" r="12" fill="#06C755"/>
  <text x="505" y="1162" text-anchor="middle" class="t chip">ล่วงหน้า 2–4 สัปดาห์</text>

  <rect x="656" y="1124" width="225" height="58" rx="29" fill="#E4F4E8"/>
  <circle cx="691" cy="1153" r="12" fill="#06C755"/>
  <text x="775" y="1162" text-anchor="middle" class="t chip">แผนที่และวิธีรับมือ</text>

  <rect x="164" y="1205" width="672" height="64" rx="32" fill="#8B4A28"/>
  <text x="500" y="1249" text-anchor="middle" class="t cta">รู้ก่อน • เตรียมก่อน • รับมือได้ทัน</text>
</svg>
