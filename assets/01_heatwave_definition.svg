<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="233mm" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">นิยามคลื่นความร้อน</title>
  <desc id="desc">แผนภาพอธิบาย P90 ของแต่ละจังหวัดและเงื่อนไขต่อเนื่องสามวัน</desc>
  
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5A342A" flood-opacity="0.10"/>
      </filter>
      <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="12" stroke="#BDB3A8" stroke-width="4"/>
      </pattern>
      <linearGradient id="heatGradient" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#FFF3D7"/><stop offset="0.45" stop-color="#F5B84E"/>
        <stop offset="0.75" stop-color="#EE6A3B"/><stop offset="1" stop-color="#9E2F31"/>
      </linearGradient>
    </defs>
    
  <rect x="0" y="0" width="1800" height="1000" rx="0" fill="#FFF8EA" stroke="none" stroke-width="0" opacity="1"/><circle cx="70" cy="70" r="34" fill="#EE6A3B" stroke="none" stroke-width="0"/><text x="70" y="81" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="25" font-weight="900" fill="#FFFFFF" text-anchor="middle" opacity="1">01</text><text x="125" y="76" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="44" font-weight="900" fill="#5A342A" text-anchor="start" opacity="1">นิยามคลื่นความร้อนที่เหมาะกับแต่ละพื้นที่</text><text x="125" y="112" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="21" font-weight="550" fill="#6C5B52" text-anchor="start" opacity="1">ร้อนผิดปกติของพื้นที่ • เกิดต่อเนื่อง • ตรวจสอบได้</text><rect x="55" y="150" width="800" height="705" rx="28" fill="#FFFCF5" stroke="#D8CDC0" stroke-width="2" opacity="1"/><text x="95" y="205" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="28" font-weight="850" fill="#5A342A" text-anchor="start" opacity="1">1  เปรียบเทียบกับอดีต 30 ปีของจังหวัด</text><line x1="120" y1="675" x2="785" y2="675" stroke="#9B8B7E" stroke-width="3" stroke-linecap="round" opacity="1"/><line x1="120" y1="300" x2="120" y2="675" stroke="#9B8B7E" stroke-width="3" stroke-linecap="round" opacity="1"/><path d="M120 675 C240 670 270 560 350 430 C420 315 520 325 585 455 C625 535 655 615 785 675 L785 675 Z" fill="#F4D39C" stroke="#CE9340" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><rect x="650" y="290" width="135" height="385" rx="0" fill="#EE6A3B" stroke="none" stroke-width="0" opacity="0.16"/><line x1="650" y1="275" x2="650" y2="690" stroke="#EE6A3B" stroke-width="6" stroke-linecap="round" opacity="1" stroke-dasharray="12 8"/><text x="650" y="250" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="31" font-weight="900" fill="#EE6A3B" text-anchor="middle" opacity="1">P90</text><text x="340" y="725" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="22" font-weight="700" fill="#6C5B52" text-anchor="middle" opacity="1">90% ของสภาพอากาศฐาน</text><text x="715" y="725" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="22" font-weight="800" fill="#B94836" text-anchor="middle" opacity="1">10% ที่ร้อนผิดปกติ</text><text x="135" y="780" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="24" font-weight="800" fill="#235D66" text-anchor="start" opacity="1">คำนวณจากช่วงวันเดียวกันของปี ±15 วัน</text><text x="135" y="817" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="22" font-weight="600" fill="#6C5B52" text-anchor="start" opacity="1">จึงไม่ใช้ค่าอุณหภูมิ °C เดียวตัดสินทั้งประเทศ</text><rect x="895" y="150" width="850" height="705" rx="28" fill="#FFFCF5" stroke="#D8CDC0" stroke-width="2" opacity="1"/><text x="935" y="205" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="28" font-weight="850" fill="#5A342A" text-anchor="start" opacity="1">2  ต้องสูงกว่า P90 ติดต่อกันอย่างน้อย 3 วัน</text><line x1="965" y1="560" x2="1665" y2="560" stroke="#AD9C8F" stroke-width="4" stroke-linecap="round" opacity="1"/><text x="1670" y="568" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="22" font-weight="750" fill="#6C5B52" text-anchor="start" opacity="1">P90</text><line x1="1080" y1="560" x2="1080" y2="420" stroke="#D5C3B6" stroke-width="4" stroke-linecap="round" opacity="1"/><circle cx="1080" cy="420" r="25" fill="#EE6A3B" stroke="#FFFFFF" stroke-width="7"/><text x="1080" y="650" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="25" font-weight="800" fill="#5A342A" text-anchor="middle" opacity="1">วันที่ 1</text><text x="1080" y="690" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="19" font-weight="750" fill="#B94836" text-anchor="middle" opacity="1">สูงกว่า P90</text><line x1="1315" y1="560" x2="1315" y2="385" stroke="#D5C3B6" stroke-width="4" stroke-linecap="round" opacity="1"/><circle cx="1315" cy="385" r="25" fill="#EE6A3B" stroke="#FFFFFF" stroke-width="7"/><text x="1315" y="650" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="25" font-weight="800" fill="#5A342A" text-anchor="middle" opacity="1">วันที่ 2</text><text x="1315" y="690" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="19" font-weight="750" fill="#B94836" text-anchor="middle" opacity="1">สูงกว่า P90</text><line x1="1550" y1="560" x2="1550" y2="405" stroke="#D5C3B6" stroke-width="4" stroke-linecap="round" opacity="1"/><circle cx="1550" cy="405" r="25" fill="#EE6A3B" stroke="#FFFFFF" stroke-width="7"/><text x="1550" y="650" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="25" font-weight="800" fill="#5A342A" text-anchor="middle" opacity="1">วันที่ 3</text><text x="1550" y="690" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="19" font-weight="750" fill="#B94836" text-anchor="middle" opacity="1">สูงกว่า P90</text><line x1="1125" y1="420" x2="1252.3264972790548" y2="395.41281431852735" stroke="#F3B64D" stroke-width="5" stroke-linecap="round" opacity="1"/><polygon points="1270,392 1254.0329044383184,404.24956567899994 1250.6200901197913,386.57606295805476" fill="#F3B64D"/><line x1="1360" y1="392" x2="1487.0426540883864" y2="400.7615623509232" stroke="#F3B64D" stroke-width="5" stroke-linecap="round" opacity="1"/><polygon points="1505,402 1486.423435263848,409.7402353067301 1487.6618729129248,391.78288939511634" fill="#F3B64D"/><rect x="1010" y="740" width="620" height="80" rx="20" fill="#3E8062" stroke="none" stroke-width="0" opacity="1"/><text x="1320" y="790" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="31" font-weight="900" fill="#FFFFFF" text-anchor="middle" opacity="1">เข้าเกณฑ์ “คลื่นความร้อน”</text><rect x="55" y="885" width="1690" height="78" rx="22" fill="#5A342A" stroke="none" stroke-width="0" opacity="1"/><text x="900" y="935" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="27" font-weight="800" fill="#FFFFFF" text-anchor="middle" opacity="1">หลักสากล: percentile + ระยะเวลาต่อเนื่อง  |  ปรับฐานให้เป็นภูมิอากาศของแต่ละจังหวัด</text>
</svg>