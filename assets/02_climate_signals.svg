<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="420mm" height="233mm" viewBox="0 0 1800 1000" role="img" aria-labelledby="title desc">
  <title id="title">สัญญาณที่ AI ใช้</title>
  <desc id="desc">อินโฟกราฟิกตัวแปรความร้อน ความชื้นดิน MJO และ Niño3.4</desc>
  
    <defs>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#5A342A" flood-opacity="0.10"/>
      </filter>
      <pattern id="hatch" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="12" stroke="#BDB3A8" stroke-width="4"/>
      </pattern>
      <linearGradient id="heatGradient" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0" stop-color="#FFF3D7"/><stop offset="0.45" stop-color="#F5B84E"/>
        <stop offset="0.75" stop-color="#EE6A3B"/><stop offset="1" stop-color="#9E2F31"/>
      </linearGradient>
    </defs>
    
  <rect x="0" y="0" width="1800" height="1000" rx="0" fill="#FFF8EA" stroke="none" stroke-width="0" opacity="1"/><circle cx="70" cy="70" r="34" fill="#EE6A3B" stroke="none" stroke-width="0"/><text x="70" y="81" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="25" font-weight="900" fill="#FFFFFF" text-anchor="middle" opacity="1">02</text><text x="125" y="76" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="44" font-weight="900" fill="#5A342A" text-anchor="start" opacity="1">AI มองเห็นสัญญาณอะไรบ้าง?</text><text x="125" y="112" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="21" font-weight="550" fill="#6C5B52" text-anchor="start" opacity="1">ทุกกลุ่มตัวแปรมีเหตุผลทางกายภาพและต้องรู้ได้ ณ วันพยากรณ์</text><rect x="70" y="165" width="805" height="300" rx="28" fill="#FFFCF5" stroke="#D8CDC0" stroke-width="2" opacity="1"/><rect x="70" y="165" width="14" height="300" rx="7" fill="#EE6A3B" stroke="none" stroke-width="0" opacity="1"/><circle cx="132" cy="227" r="34" fill="#EE6A3B" stroke="none" stroke-width="0"/><text x="132" y="239" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" opacity="1">01</text><text x="188" y="235" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="31" font-weight="900" fill="#5A342A" text-anchor="start" opacity="1">ความร้อนล่าสุด</text><text x="115" y="310" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="23" font-weight="650" fill="#6C5B52" text-anchor="start" opacity="1">Tmax • ค่าเฉลี่ย 7 วัน</text><line x1="115" y1="345" x2="830" y2="345" stroke="#EEE7DE" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="115" y="395" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="21" font-weight="800" fill="#EE6A3B" text-anchor="start" opacity="1">บอกความร้อนที่กำลังสะสม</text><line x1="770" y1="235" x2="770" y2="380" stroke="#EE6A3B" stroke-width="13" stroke-linecap="round" opacity="1"/><circle cx="770" cy="395" r="28" fill="#EE6A3B" stroke="none" stroke-width="0"/><line x1="725" y1="275" x2="745" y2="275" stroke="#EE6A3B" stroke-width="5" stroke-linecap="round" opacity="1"/><line x1="725" y1="320" x2="745" y2="320" stroke="#EE6A3B" stroke-width="5" stroke-linecap="round" opacity="1"/><rect x="925" y="165" width="805" height="300" rx="28" fill="#FFFCF5" stroke="#D8CDC0" stroke-width="2" opacity="1"/><rect x="925" y="165" width="14" height="300" rx="7" fill="#F3B64D" stroke="none" stroke-width="0" opacity="1"/><circle cx="987" cy="227" r="34" fill="#F3B64D" stroke="none" stroke-width="0"/><text x="987" y="239" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" opacity="1">02</text><text x="1043" y="235" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="31" font-weight="900" fill="#5A342A" text-anchor="start" opacity="1">ความชื้นดิน</text><text x="970" y="310" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="23" font-weight="650" fill="#6C5B52" text-anchor="start" opacity="1">ผิวดินและชั้นลึก • ค่าเฉลี่ย 7/30 วัน</text><line x1="970" y1="345" x2="1685" y2="345" stroke="#EEE7DE" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="970" y="395" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="21" font-weight="800" fill="#F3B64D" text-anchor="start" opacity="1">ดินแห้งทำให้พื้นผิวร้อนได้ง่ายและจำสภาพได้นาน</text><path d="M1595 245 C1560 300 1552 330 1595 370 C1638 330 1630 300 1595 245Z" fill="#F7D18B" stroke="#F3B64D" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><line x1="1515" y1="395" x2="1670" y2="395" stroke="#F3B64D" stroke-width="6" stroke-linecap="round" opacity="1"/><line x1="1530" y1="420" x2="1650" y2="420" stroke="#F3B64D" stroke-width="6" stroke-linecap="round" opacity="1"/><rect x="70" y="505" width="805" height="300" rx="28" fill="#FFFCF5" stroke="#D8CDC0" stroke-width="2" opacity="1"/><rect x="70" y="505" width="14" height="300" rx="7" fill="#427A9C" stroke="none" stroke-width="0" opacity="1"/><circle cx="132" cy="567" r="34" fill="#427A9C" stroke="none" stroke-width="0"/><text x="132" y="579" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" opacity="1">03</text><text x="188" y="575" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="31" font-weight="900" fill="#5A342A" text-anchor="start" opacity="1">MJO</text><text x="115" y="650" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="23" font-weight="650" fill="#6C5B52" text-anchor="start" opacity="1">RMM1/RMM2 • phase • amplitude</text><line x1="115" y1="685" x2="830" y2="685" stroke="#EEE7DE" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="115" y="735" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="21" font-weight="800" fill="#427A9C" text-anchor="start" opacity="1">ติดตามวงจรเมฆและฝนเขตร้อนในช่วงหลายสัปดาห์</text><path d="M665 690 C685 630 755 625 775 675 C825 665 835 740 770 740 H685 C630 740 625 695 665 690Z" fill="#D9E8EE" stroke="#427A9C" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><path d="M650 600 A110 110 0 0 1 810 620" fill="none" stroke="#427A9C" stroke-width="8" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><text x="810" y="624" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="42" font-weight="900" fill="#427A9C" text-anchor="middle" opacity="1">›</text><rect x="925" y="505" width="805" height="300" rx="28" fill="#FFFCF5" stroke="#D8CDC0" stroke-width="2" opacity="1"/><rect x="925" y="505" width="14" height="300" rx="7" fill="#3E8062" stroke="none" stroke-width="0" opacity="1"/><circle cx="987" cy="567" r="34" fill="#3E8062" stroke="none" stroke-width="0"/><text x="987" y="579" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF" text-anchor="middle" opacity="1">04</text><text x="1043" y="575" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="31" font-weight="900" fill="#5A342A" text-anchor="start" opacity="1">Niño3.4 + ฤดูกาล + พื้นที่</text><text x="970" y="650" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="23" font-weight="650" fill="#6C5B52" text-anchor="start" opacity="1">Niño3.4 เดือนก่อน • วันของปี • พิกัดจังหวัด</text><line x1="970" y1="685" x2="1685" y2="685" stroke="#EEE7DE" stroke-width="2" stroke-linecap="round" opacity="1"/><text x="970" y="735" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="21" font-weight="800" fill="#3E8062" text-anchor="start" opacity="1">บอกสภาวะมหาสมุทรและความแตกต่างระหว่างพื้นที่</text><path d="M1500 710 Q1540 650 1580 710 T1660 710" fill="none" stroke="#3E8062" stroke-width="10" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><circle cx="1580" cy="625" r="34" fill="#F4C854" stroke="#3E8062" stroke-width="4"/><path d="M1565 623 q15 -20 30 0 q-15 25 -30 0" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" stroke-linecap="round" opacity="1"/><rect x="70" y="850" width="1660" height="100" rx="24" fill="#5A342A" stroke="none" stroke-width="0" opacity="1"/><text x="900" y="895" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="23" font-weight="900" fill="#F3B64D" text-anchor="middle" opacity="1">NO FUTURE DATA</text><text x="900" y="928" font-family="Noto Sans Thai, Leelawadee UI, Tahoma, sans-serif" font-size="24" font-weight="750" fill="#FFFFFF" text-anchor="middle" opacity="1">AI ได้รับเฉพาะข้อมูลที่ประกาศแล้ว ณ วันออกพยากรณ์—ไม่มีคำตอบจากอนาคตปะปน</text>
</svg>